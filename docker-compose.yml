services:
  frontend:
    build: ./frontend/pro-tasker
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/pro-tasker:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env